name: Build and Upload Artifacts
on:
  push:
    branches:
      - linux-build-fixes
      - main
      - master
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build zip unzip
      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${GITHUB_WORKSPACE}/vcpkg"
          "${GITHUB_WORKSPACE}/vcpkg/bootstrap-vcpkg.sh"
      - name: Configure
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
        run: cmake --preset vcpkg
      - name: Build
        run: cmake --build --preset vcpkg -j 2
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfs-linux
          path: build/tfs
