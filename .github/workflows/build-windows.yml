name: Build Windows Artifacts
on:
  pull_request:
    branches:
      - master
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Ninja
        run: choco install ninja -y --no-progress
      - name: Setup vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:GITHUB_WORKSPACE/vcpkg"
          & "$env:GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.bat"
      - name: Configure
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
          CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake
        run: cmake -G "Ninja" -D CMAKE_BUILD_TYPE=Release --preset vcpkg
      - name: Build
        shell: pwsh
        run: cmake --build --preset vcpkg -j 2
      - name: Prepare artifact (exe + DLLs)
        shell: pwsh
        run: |
          $workspace = "$env:GITHUB_WORKSPACE"
          $dist = Join-Path $workspace "dist/windows-release"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $candidates = @(
            Join-Path $workspace "build/tfs.exe",
            Join-Path $workspace "build/Release/tfs.exe"
          )
          foreach ($c in $candidates) { if (Test-Path $c) { Copy-Item $c -Destination $dist -Force } }
          $dllRelease = Join-Path $workspace "build/vcpkg_installed/x64-windows/bin/*.dll"
          if (Test-Path (Split-Path $dllRelease)) { Copy-Item $dllRelease -Destination $dist -Force -ErrorAction SilentlyContinue }
          $dllDebug = Join-Path $workspace "build/vcpkg_installed/x64-windows/debug/bin/*.dll"
          if (Test-Path (Split-Path $dllDebug)) { Copy-Item $dllDebug -Destination $dist -Force -ErrorAction SilentlyContinue }
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfs-windows
          path: dist/windows-release
